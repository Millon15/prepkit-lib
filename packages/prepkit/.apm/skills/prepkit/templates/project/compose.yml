x-bun: &bun
  image: oven/bun:__BUN__
  working_dir: /app
  volumes:
    - .:/app
    - root_node_modules:/app/node_modules
    - web_node_modules:/app/web/node_modules
    - api_node_modules:/app/api/node_modules

services:
  # The only installer. web and api wait for it; bun.lock is frozen once it exists.
  deps:
    <<: *bun
    command:
      [
        "sh",
        "-c",
        "if [ -f bun.lock ]; then bun install --frozen-lockfile; else bun install; fi",
      ]

  web:
    <<: *bun
    working_dir: /app/web
    command: ["bun", "--bun", "run", "dev"]
    ports:
      - "127.0.0.1:__WEB_PORT__:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

  api:
    <<: *bun
    working_dir: /app/api
    command: ["bun", "--watch", "src/index.ts"]
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  root_node_modules:
  web_node_modules:
  api_node_modules:
